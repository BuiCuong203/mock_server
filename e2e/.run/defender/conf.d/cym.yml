# e2e: defender  (http://localhost:18081 được run_e2e.sh thay bằng URL mock server)
input:
  - type: microsoft_defender
    input_id: "e2e_defender"
    tenant_id: "mock_tenant_id_defender"
    client_id: "mock_client_id_defender"
    client_secret: "mock_client_secret_defender"
    alert_url: "http://localhost:18081/mock/defender/alerts"
    scope_url: "https://api.securitycenter.microsoft.com/.default"
    proxy_url: "http://localhost:18081"
    duration: 60
    add_field:
      log_source_name: "e2e defender"
output:
  - type: stdout
