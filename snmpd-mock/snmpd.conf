# ================= snmpd.conf cho mock SNMP (lab test) =================
# Collector poll vào:  hosts: ["udp:<IP máy chạy Docker>/1161/cym_ro_2026"]
# Sửa file này rồi: docker compose restart  (file được mount, không cần build lại)

# Nghe cả UDP và TCP cổng 161 trong container (map ra 1161 ở máy host)
agentaddress  udp:161,tcp:161

# Cho xem toàn bộ cây OID
view   allview  included  .1.3.6

# Community chỉ đọc. "default" = mọi IP (chỉ dùng trong lab; qua NAT Docker IP nguồn là gateway)
rocommunity  cym_ro_2026  default  -V allview

# ---- Giá trị tĩnh nhóm system (1.3.6.1.2.1.1) ----
sysName      mock-snmp-01
sysLocation  "Docker lab"
sysContact   "soc@example.com"

# ---- Message mock (NET-SNMP-EXTEND-MIB, walk 1.3.6.1.4.1.8072.1.3.2.3.1.1) ----
# Mỗi lần collector poll, script chạy lại -> timestamp mới
extend cym_msg   /usr/local/bin/cym_msg.sh
extend cym_fixed /bin/echo {"state":"success","action":"NODE_POST_INFO_1","user":"hoangnx"}

# ---- Ép giá trị cố định cho OID riêng (enterprise 99999) ----
override .1.3.6.1.4.1.99999.1.1.0 octet_str "mock-device-model-X1"
override .1.3.6.1.4.1.99999.1.2.0 integer   42
override .1.3.6.1.4.1.99999.1.3.0 counter   123456

# ---- (Tùy chọn) snmpd tự bắn trap tới collector ----
# trap2sink  <IP_COLLECTOR>:162  cym_ro_2026
# linkUpDownNotifications yes
